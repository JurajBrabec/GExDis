services:
  gexdis:
    build:
      context: .
    container_name: gexdis
    environment:
      # BIN_DIR: /app/bin
      # CONFIG_DIR: /app/config
      # DOWNLOAD_DIR: /app/download
      HOST: 0.0.0.0
      # IDLE_TIMEOUT_SECONDS: 60
      # LOG_DIR: /app/log
      # LOG_RETENTION_DAYS: 30
      # PORT: 3000
      # RELEASE_DIR: /app/release
      # TMP_DIR: /app/tmp
    image: jurajbrabec/gexdis:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    user: "${UID}:${GID}"
    volumes:
      - ./app/config:/app/config:ro
      - ./app/tmp:/app/tmp
      - ./app/download:/app/download
      - ./app/release:/app/release
      - ./app/bin:/app/bin
      - ./app/log:/app/log

  gexdis-dev:
    build:
      context: .
      dockerfile: .dockerfile
      target: dev
    container_name: gexdis-dev
    environment:
      HOST: 0.0.0.0
      # PORT: 3000
    image: jurajbrabec/gexdis:dev
    ports:
      - "3000:3000"
    # The dev image already runs as the unprivileged `bun` user; no explicit
    # `user:` override needed (kept out to avoid fighting UID mapping on Windows).
    volumes:
      - ./app/config:/workspace/app/config:ro
      - ./app/tmp:/workspace/app/tmp
      - ./app/download:/workspace/app/download
      - ./app/release:/workspace/app/release
      - ./app/bin:/workspace/app/bin
      - ./app/log:/workspace/app/log
      # Bind the working tree so edits and hot-reload (bun --watch) apply live.
      - .:/workspace
    working_dir: /workspace
    command: ["bun", "run", "dev"]
