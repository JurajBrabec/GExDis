variants:
  github:
    - name: default
      url: ^https://github\.com/[^/]+/[^/]+/releases/tag/.+$
      # or specify the organization and repository explicitly (don't use url)
      # org: org-name
      # repo: repo-name
      # or specify the full repository name directly (don't use org and url)
      # repo: org-name/repo-name
      # or specify the full repository name directly as name (don't use org, repo and url)
      # name: org-name/repo-name
      get:
        - (?<EXE_NAME>[^/]+\.exe)$
        - (?<ZIP_NAME>[^/]+\.zip)$
      unpack:
        - ^{ZIP_NAME}$
      remove:
        - '^/app/download/{ORG}-{REPO}-{TAG}/{EXE_NAME}-v[0-9]+\.[0-9]+\.[0-9]+\.exe$'
      copy:
        - ^{EXE_NAME}$:/app/download/{ORG}-{REPO}-{TAG}/{EXE_NAME}
        - ^{ZIP_NAME}$:/app/download/{ORG}-{REPO}-{TAG}/{ZIP_NAME}
        - ^{UNPACKED}/.+\.exe$:/app/download/{ORG}-{REPO}-{TAG}/{UNPACKED}
  peeplink:
    - name: default
      url: ^https://peeplink\.in/(?<ID>.+)$
      get:
        - ^https://rg\.to/.+
        - ^https://rapidgator\.net/.+
      unpack:
        - ^{DOWNLOADED}$
      copy:
        - ^{UNPACKED}$:/app/release
